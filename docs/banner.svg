<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Smart Campus Companion" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="aurora" cx="18%" cy="8%" r="60%">
      <stop offset="0" stop-color="#a8e6cf" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#a8e6cf" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#a8e6cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="92%" cy="100%" r="55%">
      <stop offset="0" stop-color="#9fc8ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#9fc8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#aurora)"/>
  <rect width="1280" height="360" fill="url(#aurora2)"/>

  <!-- logo mark -->
  <g transform="translate(96,96)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#a8e6cf"/>
    <text x="32" y="46" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#0e1726">C</text>
  </g>
  <text x="180" y="142" font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="20" letter-spacing="3" fill="#8c97aa">SMART CAMPUS COMPANION</text>

  <!-- wordmark -->
  <text x="94" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#e9ecf2">Your campus, in one place.</text>

  <!-- tagline -->
  <text x="96" y="282" font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#aeb8c8">A secure dashboard for announcements, events, study resources and openings — with roles enforced on the server.</text>

  <!-- category chips -->
  <g font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(96,312)">
      <rect width="172" height="34" rx="17" fill="#a8e6cf" fill-opacity="0.16"/>
      <circle cx="22" cy="17" r="5" fill="#a8e6cf"/>
      <text x="38" y="23" fill="#a8e6cf">Announcements</text>
    </g>
    <g transform="translate(280,312)">
      <rect width="98" height="34" rx="17" fill="#9fc8ff" fill-opacity="0.16"/>
      <circle cx="22" cy="17" r="5" fill="#9fc8ff"/>
      <text x="38" y="23" fill="#9fc8ff">Events</text>
    </g>
    <g transform="translate(390,312)">
      <rect width="126" height="34" rx="17" fill="#f2cf8d" fill-opacity="0.16"/>
      <circle cx="22" cy="17" r="5" fill="#f2cf8d"/>
      <text x="38" y="23" fill="#f2cf8d">Resources</text>
    </g>
    <g transform="translate(528,312)">
      <rect width="118" height="34" rx="17" fill="#f5a894" fill-opacity="0.16"/>
      <circle cx="22" cy="17" r="5" fill="#f5a894"/>
      <text x="38" y="23" fill="#f5a894">Openings</text>
    </g>
  </g>

  <!-- stack line, right-aligned -->
  <text x="1184" y="332" text-anchor="end" font-family="'Archivo', 'Segoe UI', system-ui, sans-serif" font-size="15" letter-spacing="1" fill="#5d6370">MERN · TypeScript · Zod · MongoDB</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
